[package]
name = "claude-sessions"
version = "0.18.4"
edition = "2024"
rust-version = "1.85"
description = "Several Claude Code sessions per box, cheap when idle, findable after a disconnect"
repository = "https://github.com/gsfernandes81/claude-sessions"
license = "AGPL-3.0-or-later"

# Dependencies are allowed (owner, 2026-11-06). A crate must cross-compile to the static musl
# release for both architectures (aarch64 and x86_64-unknown-linux-musl), since that is what
# ships. Until that date the crate took none, so what it needed from libc is declared by hand,
# each with a note on why its layout is the same on both targets: flock in src/lockfile.rs;
# kill and the pidfd calls in src/signal.rs; socket, send and recv for the socket-diagnostics
# netlink in src/sockdiag.rs; clock_gettime in src/clock.rs; termios, ioctl, poll, signal and
# read in src/term.rs. Those can move to a crate when one is worth it.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Panics unwind, as they do in the tests. Aborting would make any panic a SIGABRT and a core
# dump in the cwd (a git checkout, for the menu; issue #6), show a panicking synchronous hook
# to the person, and kill the whole menu where the tests see a worker thread's panic caught.

# For cargo-mutants (.cargo/mutants.toml): the test profile without debug info, so the build
# each mutant pays is smaller.
[profile.mutants]
inherits = "test"
debug = "none"
