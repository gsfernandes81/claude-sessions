[package]
name = "claude-sessions"
version = "0.4.6"
edition = "2024"
rust-version = "1.85"
description = "Several Claude Code sessions per box, cheap when idle, findable after a disconnect"
repository = "https://github.com/gsfernandes81/claude-sessions"
license = "AGPL-3.0-or-later"

# NO DEPENDENCIES, and that is a decision rather than an accident. Three reasons, in the
# order they matter:
#
#   1. This binary is pulled into a container image by checksum and is what an ssh login
#      lands on. Every crate is a thing to audit and a thing that must cross-compile to
#      static musl for two architectures.
#   2. Hook payloads have to be read TOLERANTLY — Claude Code updates itself in place in
#      these containers, so an unknown or renamed field must degrade to "no evidence"
#      rather than to an error on the door. src/json.rs reads a Value tree, which does that
#      more honestly than a struct of twelve Options.
#   3. The container this is developed in HAS NO C LINKER and no way to install one, so a
#      crate with a build script or a proc macro cannot be compiled here at all. With no
#      dependencies the whole crate builds and its tests run against
#      aarch64-unknown-linux-musl using the toolchain's own rust-lld — see
#      .cargo/config.toml. A dependency on serde would mean the tests could only ever be
#      run in CI, and the tests are the product.
#
# The syscalls needed are declared directly, each with a note on why its layout is the same
# on both targets: flock in src/lockfile.rs; kill and the pidfd calls in src/signal.rs;
# socket, send and recv for the socket-diagnostics netlink in src/sockdiag.rs; clock_gettime
# in src/clock.rs; termios, ioctl, poll, signal and read in src/term.rs.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Panics unwind, as they do in the tests. Aborting would make any panic a SIGABRT and a core
# dump in the cwd (a git checkout, for the menu; issue #6), show a panicking synchronous hook
# to the person, and kill the whole menu where the tests see a worker thread's panic caught.
