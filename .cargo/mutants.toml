# cargo-mutants (https://mutants.rs), pinned in Dockerfile.dev. Run from the repo root:
#
#   cargo mutants                  # every mutant against the whole suite
#   cargo mutants -- --bins        # a fast first pass, unit tests only; then
#   cargo mutants --iterate        # re-test only what that pass missed, with everything
#
# On zero, always under `nice -n 19 ionice -c3`, so the run takes only what the shared Pi's
# other containers leave, with -j and --jobserver-tasks sized to keep its load around 4, its
# core count, not pinned (owner, 2026-10-28: un-niced, two jobs took its load to 7).

# A build without debug info: each mutant is a fresh compile and link, and nothing reads a
# backtrace from one.
profile = "mutants"
