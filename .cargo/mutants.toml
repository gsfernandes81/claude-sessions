# cargo-mutants (https://mutants.rs), pinned in Dockerfile.dev. Run from the repo root:
#
#   cargo mutants                  # every mutant against the whole suite
#   cargo mutants -- --bins        # a fast first pass, unit tests only; then
#   cargo mutants --iterate        # re-test only what that pass missed, with everything
#
# On zero, always under `nice -n 19 ionice -c3`, so the run takes only what the shared Pi's
# other containers leave, with -j and --jobserver-tasks sized to keep its load around 4, its
# core count, not pinned (owner, 2026-10-28: un-niced, two jobs took its load to 7). Memory is
# the harder limit there (a 1.5 GiB container): a mutant that loops while allocating fills it
# before any timeout, so the tests run capped, through a runner that sets `ulimit -v 786432`
# and execs its arguments:
#
#   CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER=/path/to/capped.sh nice -n 19 ionice -c3 \
#       cargo mutants ...
#
# The compiler is not capped: a fresh build needs more than 768 MiB, and it does not run away.
# A pass that retests timeouts, as --iterate does, runs -j 1.

# A build without debug info: each mutant is a fresh compile and link, and nothing reads a
# backtrace from one.
profile = "mutants"

# Mutants that are equivalent, or that only a fault no test can provoke would tell apart, each
# group with why (2026-10-28, after the first full run). A pattern names the function and the
# operator, not the line, so it outlives edits; a new mutant it hides by accident is the cost.
exclude_re = [
    # Flag bits that do not overlap: `|` and `^` are the same value.
    'src/sockdiag\.rs:.*: replace \| with \^ in (tcp|dump)$',
    'src/lockfile\.rs:.*: replace \| with \^ in SlotLock::acquire$',
    'src/term\.rs:.*: replace \| with \^ in mouse$',
    # Answers the kernel never gives here: descriptor 0 (stdin is open), a zero-length send,
    # receive or write, a dump part exactly the buffer's length.
    'src/sockdiag\.rs:.*: replace < with (==|<=) in (tcp|dump)$',
    'src/sockdiag\.rs:.*: replace > with (==|>=) in dump$',
    'src/signal\.rs:.*: replace < with <= in pidfd_open$',
    'src/term\.rs:.*: replace < with <= in write_fd$',
    # A dump asked with no flags still ends, blocking, and a part never outgrows the buffer.
    'src/sockdiag\.rs:.*: replace \| with & in dump$',
    # A message exactly as long as `inet_diag_msg` has no attributes, so no counts, either way.
    'src/sockdiag\.rs:.*: replace < with <= in socket_bytes$',
    # EINTR retries: an interrupted poll or read cannot be made to happen on cue.
    'src/term\.rs:.*: replace == with != in RawTerminal::(wait|read_keys|read_once)$',
    # The terminal, as Linux's ptys behave: a hangup polls readable and reads 0 (tested), so
    # the hangup mask is reached only for a closed descriptor; the -1 fallbacks are for pipes
    # that always exist; a zero timeout and a 1 ms one end the same way; set_nonblocking on a
    # fresh socketpair does not fail; an Alt chord's multi-byte character is dropped whole or
    # as invalid bytes, which are dropped too.
    'src/term\.rs:.*: replace \| with [&^] in RawTerminal::wait$',
    'src/term\.rs:.*: replace & with \| in RawTerminal::wait$',
    'src/term\.rs:.*: delete - in RawTerminal::wait$',
    'src/term\.rs:\d+:\d+: delete -$',
    'src/term\.rs:.*: replace match guard !left\.is_zero\(\) with true in RawTerminal::wait$',
    'src/term\.rs:.*: replace \|\| with && in RawTerminal::read_keys$',
    'src/term\.rs:.*: replace && with \|\| in (readable_within|install|wake_pair)$',
    'src/term\.rs:.*: replace match guard c >= 0x80 with false in parse_escape$',
    'src/term\.rs:.*: replace \+ with \* in parse_escape$',
    # Timing only: a deadline compared with `<` or `<=`, a wait that only adds a wait.
    'src/launch\.rs:.*: replace < with <= in (resume|resume_conversation|new_session_with)$',
    'src/launch\.rs:.* in wait_session_gone$',
    'src/launch\.rs:.*: replace && with \|\| in settle$',
    'src/hub\.rs:.*: replace < with <= in offload_all$',
    'src/zmx\.rs:.*: replace < with <= in list_from$',
    'src/activity\.rs:.*: replace < with <= in pass$',
    'src/run\.rs:.*: replace \+ with - in run$',
    # The same outcome either way: stopping a process already gone succeeds; closing the fd
    # releases a flock; "max" does not parse as a number; a down container has no rows; the
    # home's header read again on a heard event reads the same; and in the renderer, bounds
    # that are equal only where the result is the same or at widths the menu refuses.
    'src/launch\.rs:.*: replace match guard procinfo::is_alive\(pid, start\) with true in (offload|close)$',
    'src/lockfile\.rs:.*<impl Drop for SlotLock>::drop with \(\)$',
    'src/mem\.rs:.*: replace match guard s\.trim\(\) == "max" with false in read_at$',
    'src/menu\.rs:.*: replace && with \|\| in Menu::container_row$',
    'src/run\.rs:.*: replace != with == in drive$',
    'src/render\.rs:.*: replace < with <= in (Line::pad|scroll_to)$',
    'src/render\.rs:.*: replace > with >= in wrap$',
    'src/render\.rs:.*: replace \+ with [-*] in heading$',
    'src/render\.rs:.*: replace \+ with \* in row$',
    # Caches whose miss only costs a read: an unchanged transcript read again, a size or a
    # modification time alone (an append moves both), a newline's offset kept or not.
    'src/transcript\.rs:.*: replace match guard upto == len with false in titles_cached$',
    'src/transcript\.rs:.*: replace < with <= in titles_cached$',
    'src/transcript\.rs:.*: replace \+ with \* in whole_lines$',
    'src/store\.rs:12\d:\d+: replace && with \|\| in in_workspace$',
    # Thin wrappers that read the live machine, over functions tested on their own:
    # `marks_in`/`set_in`, `oom_kill_in`, `teardown_listed`, `orphans`/`kill_tree`,
    # `socket_dir_from`, `Watch::refresh`, `term::size`, `Deps`' parts, `snapshot_of` (whose
    # `/proc` readers these are); and the agent's own log.
    'src/archive\.rs:.*: replace (dir|marks|set) -> ',
    'src/mem\.rs:.*: replace oom_kills -> ',
    'src/offload\.rs:.*: replace (teardown_zmx -> |sweep_orphans with)',
    'src/zmx\.rs:.*: replace (socket_dir|Watch::sessions) -> ',
    'src/run\.rs:.*<impl Console for RawTerminal>::size',
    'src/agent\.rs:.*: replace log with \(\)$',
    'src/launch\.rs:.* in Deps::from_env$',
    'src/activity\.rs:.*<impl Members for Procfs>::',
    # Agent messaging, `peer.rs` and `router.rs` (2026-11-09).
    # The kernel gives a socket's peer pid as 0 only for a peer in another pid namespace, and a
    # failed getsockopt leaves it 0: neither happens to a socket in this container.
    'src/peer\.rs:.*: replace (&& with \|\||> with >=) in peer_pid$',
    # The log alone: which relay-lock failure, read error or frame of no known type is logged,
    # whether the relay says it is on again, what came of naming a record, which kind a frame
    # is, how a notice was handed on, a host the router refuses, a container still not
    # answering; and the agent's own log.
    'src/peer\.rs:.*: replace (match guard e\.kind\(\) == io::ErrorKind::WouldBlock with (true|false)|== with !=) in Relay::start$',
    'src/peer\.rs:.*: replace match guard st\.off\.is_some\(\) with (true|false) in Relay::apply$',
    'src/peer\.rs:.*: replace (!= with ==|&& with \|\|) in Relay::take$',
    'src/peer\.rs:.*: delete match arm Some\("auth"\) in Relay::take$',
    'src/peer\.rs:.*log_naming',
    'src/peer\.rs:.*: replace log with \(\)$',
    'src/router\.rs:.*: delete match arm Some\("user"\) in Item::kind$',
    'src/router\.rs:.*: delete match arm Some\(Ok\(\(\)\)\) in notify$',
    'src/router\.rs:.*: delete ! in serve$',
    'src/router\.rs:.*: replace != with == in watch$',
    # Timing only: how long peer-check waits for a record (the verdict is the same, or comes
    # later) and for the checked claude to leave (it leaves or is killed, and the scratch
    # directory goes either way), how often old messages are pruned (the same ones go), and
    # how fast a container that does not answer is asked again.
    'src/peer\.rs:.*: replace (> with (==|>=)|\|\| with &&) in check$',
    'src/peer\.rs:.*: replace [^ ]+ with [^ ]+ in end_checked$',
    'src/router\.rs:.*: replace >= with < in serve$',
    'src/router\.rs:.*: replace \* with / in watch$',
]
