# WHY THIS FILE EXISTS: the development container has no C linker.
#
# `cc` is absent, there is no libc-dev and no way to install either — these are dev
# containers for an Ansible/config repo, not a build host. Rust's `*-linux-musl` targets ship
# self-contained CRT objects and a static libc, so with the toolchain's own `rust-lld` the
# whole crate links with no system toolchain at all. The binaries are native aarch64, so
# `cargo test` runs them directly.
#
# This is also what gets shipped: the release is a static musl build, so developing against
# the same target means the thing under test is the thing published rather than a glibc
# cousin of it.
#
# CI overrides the target explicitly per job (it builds both architectures), so pinning it
# here costs nothing there.
[build]
target = "aarch64-unknown-linux-musl"

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "linker=rust-lld", "-C", "link-self-contained=yes"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "linker=rust-lld", "-C", "link-self-contained=yes"]
