# Tests and the release build, in one file.
#
# WHY MUSL EVERYWHERE: the consumer is a Dockerfile that downloads a release asset and checks
# its SHA-256. A static musl binary has no runtime to match — the alternative is a glibc build
# that works on the runner and fails on a box with an older libc, for a reason nobody would
# connect back to CI. Both architectures are cross-compiled on the runner rather than built
# under emulation, because the consuming image's arm64 leg runs under QEMU and a Rust compile
# there is unusable.
#
# A RELEASE IS CUT BY BUMPING THE VERSION IN Cargo.toml ON main (owner, 2026-10-02). Every
# push to main whose version has no `v<version>` tag yet is built, tagged and released here,
# by GitHub's own token — the sessions that develop this repo cannot push tags, so the tag is
# made where the release is. A tag pushed by a person releases too, by the same job.
#
# WHY A TAG IS NEVER RE-CUT: the consumer pins a tag AND a hash. Re-cutting a published tag
# silently changes what a pinned, checksummed build gets, which is the one thing the checksum
# exists to prevent. So a version whose tag exists is skipped, never rebuilt, and
# `gh release create` refuses an existing release on its own. Releases are serialised, so two
# quick pushes of one version cannot both try.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain and the musl target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          rustup component add clippy rustfmt
      # The target is pinned to aarch64 in .cargo/config.toml, because the container this is
      # developed in has no C linker and musl + the toolchain's own rust-lld is the only
      # self-contained way to build there. The runner is x86_64, so it says so explicitly;
      # the tests then run natively here rather than needing emulation.
      - run: cargo fmt --check
      - run: cargo clippy --target x86_64-unknown-linux-musl --all-targets -- -D warnings
      # The real zmx, for tests/zmx_real.rs: the session holder is the one thing a stand-in
      # cannot prove — v0.3.8 passed every test against a stand-in while the real holder turned
      # every swipe into arrow keys. Pinned and checked, the same version infra installs; the
      # test fails under CI without it, so a broken download cannot pass for the wrong reason.
      # From the GitHub release, which the runner can reach; the hash pins the bytes whichever
      # host serves them.
      - name: Fetch the pinned zmx
        run: |
          curl -fsSLo zmx.tgz https://github.com/neurosnap/zmx/releases/download/v0.8.1/zmx-0.8.1-linux-x86_64.tar.gz
          echo "dfd75720b942466f28870731cc86dbc07afa72fb8f3bd5eeb4ff707e4eecebe8  zmx.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zmx" && tar -xzf zmx.tgz -C "$RUNNER_TEMP/zmx"
          echo "CLAUDE_SESSIONS_TEST_ZMX=$RUNNER_TEMP/zmx/zmx" >> "$GITHUB_ENV"
      - run: cargo test --target x86_64-unknown-linux-musl
      # The image's build runs this as a FATAL check on a bare static binary, so CI runs the
      # same thing rather than trusting that it would work.
      - name: --version answers on the built binary
        run: ./target/x86_64-unknown-linux-musl/debug/claude-sessions --version

  # The same tests, natively on arm64. Half of every release is an aarch64 binary — the one the
  # Pi boxes run — and until this job it shipped cross-compiled with its tests never run on the
  # architecture it ships for, except by hand in the arm64 dev container. The pinned target in
  # .cargo/config.toml is aarch64 musl, so no --target is needed here.
  test-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain and the musl target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-unknown-linux-musl
          rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      # The real zmx, for tests/zmx_real.rs: the session holder is the one thing a stand-in
      # cannot prove — v0.3.8 passed every test against a stand-in while the real holder turned
      # every swipe into arrow keys. Pinned and checked, the same version infra installs; the
      # test fails under CI without it, so a broken download cannot pass for the wrong reason.
      # From the GitHub release, which the runner can reach; the hash pins the bytes whichever
      # host serves them.
      - name: Fetch the pinned zmx
        run: |
          curl -fsSLo zmx.tgz https://github.com/neurosnap/zmx/releases/download/v0.8.1/zmx-0.8.1-linux-aarch64.tar.gz
          echo "943eb44c812333fd450da12097521afd3339436e86f8c2ac618b905c4c9ece68  zmx.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zmx" && tar -xzf zmx.tgz -C "$RUNNER_TEMP/zmx"
          echo "CLAUDE_SESSIONS_TEST_ZMX=$RUNNER_TEMP/zmx/zmx" >> "$GITHUB_ENV"
      - run: cargo test
      - name: --version answers on the built binary
        run: ./target/aarch64-unknown-linux-musl/debug/claude-sessions --version

  release:
    # Only on a push: a pull request must never publish, and neither may a manual run of the
    # tests.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Both architectures' tests, because the release publishes both architectures' binaries.
    needs: [test, test-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # Which tag this run would release, and whether it already exists. A version that is
      # already released ends the job here, which is what every ordinary push to main does.
      - name: Decide whether this push is a release
        id: plan
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
            tag="v${version}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" != tag ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            # A tag with no release, on a push to main: somebody made it by hand. Releasing
            # main's commit under it would publish code the tag does not point at.
            echo "$tag exists without a release; push that tag again or bump the version" >&2
            exit 1
          else
            echo "releasing $tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install the toolchain and both musl targets
        if: steps.plan.outputs.release == 'true'
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Build both architectures
        if: steps.plan.outputs.release == 'true'
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo build --release --target "$target"
          done
      # The consuming image runs `--version` as a fatal check and a person reads its answer to
      # learn what is installed. A tag of v0.1.0 on a binary that says 0.0.0 is a release that
      # lies about itself forever, because the tag can never be re-cut — so refuse to publish
      # until Cargo.toml says the same thing as the tag. On a push to main the tag came from
      # Cargo.toml, so this guards the tag a person pushed.
      - name: The binary says the version the tag says
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -eu
          got=$(./target/x86_64-unknown-linux-musl/release/claude-sessions --version)
          want="claude-sessions ${TAG#v}"
          if [ "$got" != "$want" ]; then
            echo "tag ${TAG} but the binary says '${got}'; bump Cargo.toml instead" >&2
            exit 1
          fi
      # The hashes go in the release body, not just in a file beside the asset: the consuming
      # Dockerfile hard-codes them, and a person copying them wants them where they can see
      # which tag they belong to.
      - name: Name the assets and hash them
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -eu
          mkdir -p dist
          {
            echo "## claude-sessions ${TAG}"
            echo
            echo 'Static musl binaries. `Dockerfile.base` pins this tag and checks these hashes.'
            echo
            echo '| asset | sha256 |'
            echo '|---|---|'
          } > dist/NOTES.md
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            arch="${target%%-*}"
            name="claude-sessions-${TAG}-${arch}-linux-musl"
            cp "target/${target}/release/claude-sessions" "dist/${name}"
            sum=$(sha256sum "dist/${name}" | cut -d' ' -f1)
            printf '| `%s` | `%s` |\n' "$name" "$sum" >> dist/NOTES.md
            printf '%s  %s\n' "$sum" "$name" >> dist/SHA256SUMS
          done
          cat dist/NOTES.md
      # `--target` makes the tag at this run's commit when it does not exist yet, which is the
      # push-to-main case; for a pushed tag it is ignored. `gh release create` refuses a
      # release that already exists, so a re-run cannot replace published assets.
      - name: Tag and publish the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "claude-sessions $TAG" \
            --notes-file dist/NOTES.md \
            dist/claude-sessions-* dist/SHA256SUMS
