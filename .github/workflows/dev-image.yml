name: dev-image

# Build this repo's dev container image (Dockerfile.dev) and push it to ghcr, so infra can pull
# it instead of building it on zero from a git context. Since 2026-10-27 the image compiles
# cargo-mutants, which is minutes of Rust on a Pi at every rebuild; built here once, it is a
# pull, and a pull of only the layers that changed.
#
# NATIVE ON EACH ARCHITECTURE, NEVER QEMU. infra's dev-base builds both platforms on one runner
# under QEMU, which is fine for a base that installs packages; a Rust compile under QEMU is
# unusable (CLAUDE.md, on the release). So arm64 builds on GitHub's arm64 runner and amd64 on
# the ordinary one, each pushes its image by digest alone, and a last job joins the two digests
# into one multi-platform tag.
#
# LAYERS ARE CACHED ACROSS RUNS, as infra's dev-base caches them (its header has the reasons):
# type=registry, mode=max, in this same package, one cache tag per architecture —
# `buildcache-amd64`, `buildcache-arm64` — so the two legs never overwrite each other's. Both
# the cache and the image are zstd with OCI media types, so a cached blob is reused byte for
# byte and keeps its digest: a change to a late step leaves every earlier layer as it was, and
# zero pulls only what changed. A cache tag is not an image; nothing pulls or pins it, and
# deleting one costs one uncached run.
#
# THE BASE IS INFRA'S, NEVER DOCKERFILE.DEV'S DEFAULT (owner, 2026-11-01; infra's
# plans/dev-image-caches.md, "The contract a child's dev-image.yml keeps"). zero builds this
# image itself, from this repo's Git context at main, with BASE_TAG from its compose's
# `x-base-tag`, and reads `buildcache-arm64` as its cache: a hit needs the same base, the same
# args (BASE_TAG alone) and the same context. So infra's dev-cache.yml dispatches this
# workflow with `base_tag` after every base publish, and a push here reads infra's current
# tag from its compose. The context is the Git context at the commit (build-push-action's
# default), as zero fetches it, not the checkout. Dockerfile.dev's default is for a build by
# hand only.
#
# TAGS. `sha-<12 hex>-base-<base tag>` is the commit and the base the image was built from,
# and never moves: a dispatch rebuilds the same commit on a new base, so a tag naming the
# commit alone would be repointed. `main` follows the latest build. Nothing pins either
# today (zero builds from the cache); they stay for a pull by hand.
#
# THE PACKAGE IS PUBLIC, and needed no flip: the first push (2026-10-28) linked it to this
# public repo, whose visibility it took. A public pull needs no token on the Pis, the same call
# infra made for its base (2026-08-24): this is pure toolchain, the same as the Dockerfile.
#
# Runs on a push to main that touches the image's inputs, and by hand:
#   gh workflow run dev-image.yml

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.dev'
      - '.github/workflows/dev-image.yml'
  workflow_dispatch:
    inputs:
      base_tag:
        description: "infra's base tag to build on; empty reads infra's current x-base-tag"
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claude-sessions-dev

# One build at a time: two would race on the cache tags and on `main`.
concurrency:
  group: dev-image
  cancel-in-progress: false

jobs:
  # One read of the tag for both legs, so a base bump landing mid-run cannot split them. The
  # input arrives as data in an env var, never pasted into the script, and is held to a tag's
  # shape before it reaches a build arg.
  base:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.base.outputs.tag }}
    steps:
      - name: Infra's base tag
        id: base
        env:
          GIVEN: ${{ inputs.base_tag }}
        run: |
          tag="$GIVEN"
          if [ -z "$tag" ]; then
            tag=$(curl -fsSL https://raw.githubusercontent.com/gsfernandes81/infra/main/dev/compose.yaml \
              | sed -n 's/^x-base-tag: &base-tag //p')
          fi
          printf '%s' "$tag" | grep -Eqx '[A-Za-z0-9][A-Za-z0-9._-]{0,127}' \
            || { echo "not a base tag: '$tag'" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Base: \`gsrpi-dev-base:$tag\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: base
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      # Pushed by digest, with no tag: the merge job below names it, together with the other
      # architecture's.
      - name: Build and push linux/${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.dev
          build-args: BASE_TAG=${{ needs.base.outputs.tag }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,oci-mediatypes=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max,compression=zstd,oci-mediatypes=true

      - name: Keep the digest for the merge
        run: |
          mkdir -p digests
          d='${{ steps.build.outputs.digest }}'
          touch "digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [base, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: One tag for both architectures
        working-directory: digests
        env:
          BASE: ${{ needs.base.outputs.tag }}
        run: |
          sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)-base-$BASE
          refs=$(for d in *; do printf '%s@sha256:%s ' "$IMAGE" "$d"; done)
          [ "$(ls | wc -l)" = 2 ] || { echo "expected two digests, got: $(ls)" >&2; exit 1; }
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "$IMAGE:sha-$sha" -t "$IMAGE:main" $refs
          docker buildx imagetools inspect "$IMAGE:sha-$sha"
          {
            echo "Pushed \`$IMAGE:sha-$sha\` and \`$IMAGE:main\` (amd64, arm64)."
          } >> "$GITHUB_STEP_SUMMARY"
